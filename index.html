<!doctype html>
<html lang="ru">

<head>
  <meta name="google-adsense-account" content="ca-pub-8437723730107585">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jetby — Presence & Projects</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />

  <!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-G3NHG0RM8Z"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-G3NHG0RM8Z');
</script>
</head>

<body>
  <!-- Background Video -->
  <video id="bgVideo" class="background-video" autoplay muted loop playsinline>
    <source src="assets/background.mp4" type="video/mp4" />
  </video>

  <div class="overlay"></div>
  <div class="glow-orb glow-orb-1"></div>
  <div class="glow-orb glow-orb-2"></div>

  <!-- Intro / Click to Enter Screen -->
  <div id="introScreen" class="intro-screen">
    <div class="intro-content">

      <div class="intro-sys-status">CLICK ANYWHERE TO ENTER</div>
    </div>
  </div>

  <!-- The invisible enter button overlay (covers the whole screen to catch clicks) -->
  <button id="enterButton" class="enter-button" aria-label="Enter portal"></button>

  <!-- Tiny audio indicator in corner when unlocked -->
  <div id="audioControls" class="audio-controls hidden">
    <button id="volumeButton" class="volume-button" aria-label="Toggle mute">
      <svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" aria-hidden="true" role="img"
        width="24" height="24" viewBox="0 0 480 512"
        style="color: rgb(74, 85, 101); opacity: 1; transform: rotate(0deg);">
        <path
          d="M215.03 71.05L126.06 160H24c-13.26 0-24 10.74-24 24v144c0 13.25 10.74 24 24 24h102.06l88.97 88.95c15.03 15.03 40.97 4.47 40.97-16.97V88.02c0-21.46-25.96-31.98-40.97-16.97zM480 256c0-63.53-32.06-121.94-85.77-156.24-11.19-7.14-26.03-3.82-33.12 7.46s-3.78 26.21 7.41 33.36C408.27 165.97 432 209.11 432 256s-23.73 90.03-63.48 115.42c-11.19 7.14-14.5 22.07-7.41 33.36 6.51 10.36 21.12 15.14 33.12 7.46C447.94 377.94 480 319.53 480 256zm-141.77-76.87c-11.58-6.33-26.19-2.16-32.61 9.45-6.39 11.61-2.16 26.2 9.45 32.61C327.98 228.28 336 241.63 336 256c0 14.38-8.02 27.72-20.92 34.81-11.61 6.41-15.84 21-9.45 32.61 6.43 11.66 21.05 15.8 32.61 9.45 28.23-15.55 45.77-45 45.77-76.88s-17.54-61.32-45.78-76.86z"
          fill="currentColor"></path>
      </svg>
    </button>
    <input id="volumeControl" type="range" min="0" max="1" step="0.01" value="0.55" class="custom-slider" />
  </div>

  <!-- Main Dashboard Container -->
  <div id="mainContent" class="page-shell locked">

    <!-- Top / Hero Profile Section -->
    <header class="dashboard-header">
      <!-- Profile Card -->
      <div class="profile-card js-tilt">
        <div class="avatar-wrap">
          <img id="discordAvatar" alt="Discord avatar" src="https://cdn.discordapp.com/embed/avatars/0.png" />
          <span id="statusDot" class="status-dot"></span>
        </div>
        <div class="profile-info">
          <p class="eyebrow">Discord presence</p>
          <h1 id="discordName" class="gradient-text">mrjetby</h1>
          <div class="status-wrapper">
            <span id="discordStatus" class="status-text">Checking status…</span>
          </div>
          <p id="discordActivity" class="activity">Offline</p>
        </div>
      </div>

      <!-- Clock / Time Card -->
      <div class="time-card js-tilt">
        <p class="eyebrow">Current time</p>
        <h2 id="nyTime">--:--:--</h2>
        <p id="nyDate">New York, USA</p>
        <div class="day-progress-container">
          <div class="day-progress-bar" id="dayProgressBar" style="width: 0%"></div>
          <span class="day-progress-label">Day Progress: --%</span>
        </div>
      </div>
    </header>

    <!-- Main Content Grid -->
    <main class="content-grid">

      <!-- Audio Card -->
      <section class="panel js-tilt" id="audioPanel">
        <div class="panel-header">
          <div class="header-main">
            <p class="eyebrow">Audio</p>
            <h3>Background Player</h3>
          </div>
        </div>

        <audio id="musicPlayer" loop preload="auto" autoplay muted>
          <source src="assets/background-music.mp3" type="audio/mpeg" />
        </audio>

        <div class="player-body">
          <div class="track-info">
            <span class="music-icon">🎵</span>
            <div class="track-meta">
              <span class="track-title">Say It Right x Habits (Stay High) (8D Audio)</span>
              <span id="playerStatus" class="track-status">Preparing audio…</span>
            </div>
          </div>

          <div>
            <!-- Interactive Visualizer -->
            <div class="visualizer" id="audioVisualizer">
              <div class="bar"></div>
              <div class="bar"></div>
              <div class="bar"></div>
              <div class="bar"></div>
              <div class="bar"></div>
              <div class="bar"></div>
              <div class="bar"></div>
              <div class="bar"></div>
            </div>
          </div>
        </div>
      </section>

      <!-- Projects Card -->
      <section class="panel js-tilt">
        <div class="panel-header">
          <p class="eyebrow">Projects</p>
          <h3>Selected Work</h3>
        </div>
        <div id="projectsList" class="card-list">
          <!-- Dynamically populated -->
        </div>
      </section>

      <!-- Links Card -->
      <section class="panel js-tilt">
        <div class="panel-header">
          <p class="eyebrow">Links</p>
          <h3>Connect</h3>
        </div>
        <div id="linksList" class="link-list">
          <!-- Dynamically populated -->
        </div>
      </section>
    </main>

    <!-- Footer -->
    <footer class="dashboard-footer">
      <p>© 2026 jetby.org</p>
    </footer>
  </div>

  <!-- Mouse glow cursor effect -->
  <div class="cursor-glow" id="cursorGlow"></div>

  <script src="script.js"></script>
</body>

</html>
